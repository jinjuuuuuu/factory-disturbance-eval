# quick_demo.yaml - 프레임워크 시연용 작은 실험 (모델 1개, 조건 8개, 5회씩)
#   python run_experiment.py --config experiments/quick_demo.yaml
name: quick_demo
episodes: 5
workers_per_model: 2

models:
  act: /data/jinju/factory/act_v2_s1/checkpoints/030000/pretrained_model

runs:
  baseline: {}                                        # 외란 없음
  camera:   {sweep: camera, levels: [1, 3]}           # 카메라 틀어짐 1·3단계
  light:    {sweep: light, levels: [5]}               # 조명 5단계
  vib:      {sweep: vib, levels: [5]}                 # 연속 진동 5단계
  combined: {sweep: all, levels: [2]}                 # 7종 동시 2단계
  control:  {sweep: friction, fixed: "mass=3", levels: [3]}   # 마찰 3단계 + 무게 3배
  custom:   {disturbance: "light=4,flicker=4"}        # 조건 직접 지정

analyze: true
